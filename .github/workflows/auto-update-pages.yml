name: Auto Update & Deploy Unciv Web Build

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click updates anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Unciv Source Code
        uses: actions/checkout@v4
        with:
          repository: 'yairm210/Unciv'
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web Target via TeaVM
        run: |
          chmod +x gradlew
          ./gradlew :teavm:build

      - name: Prepare Deployment Directory
        run: |
          mkdir -p site_output
          
          # Copy compiled TeaVM output files to deployment directory
          if [ -d "teavm/build/teavm" ]; then
            cp -r teavm/build/teavm/* site_output/
          elif [ -d "teavm/build/dist" ]; then
            cp -r teavm/build/dist/* site_output/
          else
            # Fallback search for built teavm assets
            TARGET=$(find teavm/build -type f -name "index.html" | head -n 1)
            cp -r $(dirname "$TARGET")/* site_output/
          fi
          
          # Prevent GitHub Pages from ignoring hidden files or TeaVM submodules
          touch site_output/.nojekyll

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
