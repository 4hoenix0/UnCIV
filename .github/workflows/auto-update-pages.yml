name: Auto Update & Deploy Unciv Web Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Unciv Source Code
        uses: actions/checkout@v4
        with:
          repository: 'yairm210/Unciv'
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Compile HTML Target
        run: |
          chmod +x gradlew
          ./gradlew html:dist || ./gradlew dist

      - name: Locate and Prepare Dist Directory
        run: |
          mkdir -p site_output
          # Dynamically search for index.html anywhere in the project build outputs
          INDEX_FILE=$(find . -name "index.html" -not -path "*/.*" | head -n 1)
          
          if [ -n "$INDEX_FILE" ]; then
            DIST_DIR=$(dirname "$INDEX_FILE")
            echo "Found index.html at: $INDEX_FILE"
            cp -r "$DIST_DIR"/* site_output/
          else
            echo "Error: index.html not found in build output!"
            exit 1
          fi
          
          # Prevent GitHub Pages from filtering WebGL/JS assets via Jekyll
          touch site_output/.nojekyll

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
